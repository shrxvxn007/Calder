schema_version: 1
experiment_name: synthetic_smoke
output_dir: results
dataset:
  name: synthetic
synthetic:
  n_candidates: 60
  n_features: 24
  n_groups: 5
  scenarios:
  - A
  - B
  data_seed: 317
  noise_scale: 0.2
  distribution_shift: 0.8
  group_corruption: 0.25
  group_overlap: 0.1
  outlier_fraction: 0.02
  heterogeneous_costs: false
model:
  name: random_features
  n_features: 24
  prior_precision: 1.0
  noise_floor: 0.04
  length_scale: 2.0
acquisition:
  diversity_weight: 1.0
  uncertainty_weight: 0.1
  similarity_weight: 0.1
  ucb_beta: 2.0
protocol:
  seeds:
  - 0
  - 1
  pilot_fraction: 0.3
  calibration_fraction: 0.35
  calibration_min_samples: 12
  batch_size: 10
  budget_fractions:
  - 0.1
  - 0.2
  threshold_quantiles:
  - 0.8
  policies:
  - random
  - greedy_mean
  - uncertainty
  - ucb
  - thompson
  - probability_of_hit
  - poh_diversity
  - calder
  include_oracle: true
