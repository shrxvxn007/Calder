[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "calder-research"
version = "0.1.0"
description = "Calibrated active learning for budgeted perturbation discovery"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2", "anndata>=0.11,<0.13", "scanpy>=1.10,<1.12",
  "h5py>=3.11,<4", "pyarrow>=17,<24", "networkx>=3.3,<4",
  "matplotlib>=3.9,<4", "plotly>=5.24,<7", "pydantic>=2.9,<3",
  "typer>=0.12,<1", "PyYAML>=6.0,<7", "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]
demo = ["streamlit>=1.40,<2"]
deep = ["torch>=2.5,<3"]

[project.scripts]
calder = "calder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/calder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["default"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
